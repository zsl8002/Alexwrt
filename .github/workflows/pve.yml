name: PVE x86_64 (OpenWrt stable + PassWall2)
on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: 'OpenWrt stable tag; blank selects latest stable release'
        required: false
        default: ''
  schedule:
    - cron: '0 20 * * *'
  push:
    paths: ['.github/workflows/pve.yml', 'config/pve-x86_64.config', 'scripts/**']
permissions:
  contents: write
concurrency:
  group: pve-x86_64-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail

          # GitHub-hosted Ubuntu runners may receive a broken Azure mirror entry.
          # Redirect that entry to the official Ubuntu archive.
          if [ -s /etc/apt/apt-mirrors.txt ] && grep -q 'azure.archive.ubuntu.com' /etc/apt/apt-mirrors.txt; then
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi

          # Reject partial updates instead of silently using stale package indexes.
          apt_updated=false
          for attempt in 1 2 3 4; do
            echo "APT index update attempt ${attempt}/4"
            if sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update 2>&1 | tee /tmp/apt-update.log; then
              if ! grep -Eq 'W: Failed to fetch|Some index files failed to download' /tmp/apt-update.log; then
                apt_updated=true
                break
              fi
            fi
            if [ "${attempt}" -lt 4 ]; then
              echo "APT update incomplete; retrying in 15 seconds."
              sleep 15
            fi
          done

          if [ "${apt_updated}" != true ]; then
            echo "::error::APT indexes could not be updated from Ubuntu mirrors."
            echo "DNS diagnostics:"
            getent ahosts archive.ubuntu.com || true
            getent ahosts azure.archive.ubuntu.com || true
            exit 1
          fi

          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60 \
            install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl jq ccache
      - name: Resolve latest stable OpenWrt release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.openwrt_ref }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
            git ls-remote --exit-code --refs https://github.com/openwrt/openwrt.git "refs/tags/$REF" >/dev/null
          else
            REF="$(gh api repos/openwrt/openwrt/releases/latest --jq '.tag_name')"
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "Unable to resolve a valid stable OpenWrt release tag" >&2
            exit 1
          fi
          echo "Selected OpenWrt stable tag: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - name: Clone OpenWrt stable
        run: |
          git clone --branch "${{ steps.version.outputs.ref }}" --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log -1 --format='%H %s' > "$GITHUB_WORKSPACE/base-commit.txt"
      - name: Integrate PassWall2 and configure
        run: |
          set -Eeuo pipefail
          LOG="$GITHUB_WORKSPACE/pve-build.log"
          : > "$LOG"
          trap 'status=$?; tail -n 180 "$LOG"; exit "$status"' ERR
          exec >> "$LOG" 2>&1
          cp config/pve-x86_64.config openwrt/.config
          bash scripts/add-passwall2.sh "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          ./scripts/feeds update -a
          bash "$GITHUB_WORKSPACE/scripts/prepare-pve-build.sh" "$GITHUB_WORKSPACE/openwrt"
          # The first feed-install scan can report optional dependencies before
          # their feed links are installed. Keep all official feeds; validate the
          # selected package graph with make defconfig and the completed build.
          ./scripts/feeds install -a

          # Prosody is not selected; its current recipe references Lua 5.4
          # modules absent from this stable feed. Remove only its package link.
          if ! grep -qx 'CONFIG_PACKAGE_prosody=y' .config; then
            rm -f package/feeds/packages/prosody
          fi

          # Avoid the unselected upstream Weechat Kconfig dependency cycle.
          # Keep feed repositories intact and remove only these package links.
          if ! grep -Eq '^CONFIG_PACKAGE_(luci-app-weechat|weechat-full|weechat-minimal)=y$' .config; then
            rm -f package/feeds/*/luci-app-weechat
            rm -f package/feeds/*/weechat-full
            rm -f package/feeds/*/weechat-minimal
          fi

          make defconfig
          grep -qx 'GO_DEFAULT_VERSION:=1.27' feeds/packages/lang/golang/golang-values.mk
          grep -q '^CONFIG_PACKAGE_xray-core=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall2=y$' .config
          grep -q '^CONFIG_PACKAGE_sing-box=y$' .config
          grep -q '^CONFIG_PACKAGE_geoview=y$' .config
          make -j"$(nproc)" download
      - name: Compile
        run: |
          set -Eeuo pipefail
          LOG="$GITHUB_WORKSPACE/pve-build.log"
          trap 'status=$?; tail -n 220 "$LOG"; exit "$status"' ERR
          cd openwrt
          make -j"$(nproc)" V=s >> "$LOG" 2>&1
      - name: Summarize build diagnostics
        if: always()
        run: |
          set -Eeuo pipefail
          LOG="$GITHUB_WORKSPACE/pve-build.log"
          if [ -f "$LOG" ]; then
            grep -nEi '(^|[[:space:]])(WARNING:|warning:|ERROR:|error:|fatal:)|No such file or directory|undefined reference|make\[[0-9]+\]: \*\*\*' "$LOG" | tail -n 200 || true
            echo "Total diagnostic matches: $(grep -Eic 'WARNING:|warning:|ERROR:|error:|fatal:|No such file or directory|undefined reference' "$LOG" || true)"
            echo "Missing dependency warning count: $(grep -Eic 'WARNING: Makefile .*dependency on .* does not exist' "$LOG" || true)"
          else
            echo "Build log was not created."
          fi
      - name: Collect and validate
        run: |
          set -Eeuo pipefail
          mkdir -p out
          find openwrt/bin/targets -type f \( -name '*generic*combined*.img.gz' -o -name '*generic*ext4-combined*.img.gz' -o -name '*generic*rootfs*.tar.gz' \) -exec cp -v {} out/ \;
          test -n "$(find out -type f)"
          cp openwrt/.config out/config.txt
          cp base-commit.txt upstream-commits.txt out/
          cp "$GITHUB_WORKSPACE/pve-build.log" out/ 2>/dev/null || true
          if [ -f "$GITHUB_WORKSPACE/pve-build.log" ]; then
            grep -nEi '(^|[[:space:]])(WARNING:|warning:|ERROR:|error:|fatal:)|No such file or directory|undefined reference' "$GITHUB_WORKSPACE/pve-build.log" > out/build-diagnostics.txt || true
          else
            printf 'Build log unavailable.\n' > out/build-diagnostics.txt
          fi
          (cd out && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: AlexWrt-PVE-x86_64-${{ steps.version.outputs.ref }}-${{ github.run_number }}
          path: out/*
          retention-days: 30
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pve-${{ steps.version.outputs.ref }}-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "AlexWrt PVE x86_64 $TAG" --notes 'OpenWrt stable base with PassWall2 source integration. ImmortalWrt feed overlay requires per-package compatibility validation.'

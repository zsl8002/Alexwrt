name: AX6600 JDCloud RE-CS-02
on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * *'
  push:
    paths: ['.github/workflows/ax6600.yml', 'config/ax6600.config', 'scripts/**']
permissions:
  contents: write
concurrency:
  group: ax6600-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          echo "Disk space before cleanup:"
          df -h /
          # Remove large preinstalled SDKs not used by this OpenWrt cross-build.
          # Keep the runner toolchain, Python, Node.js and GitHub Actions runtime.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          if command -v docker >/dev/null 2>&1; then
            sudo docker image prune --all --force || true
            sudo docker builder prune --all --force || true
          fi
          echo "Disk space after cleanup:"
          df -h /
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail

          # GitHub-hosted Ubuntu runners may receive a broken Azure mirror entry.
          # Redirect that entry to the official Ubuntu archive.
          if [ -s /etc/apt/apt-mirrors.txt ] && grep -q 'azure.archive.ubuntu.com' /etc/apt/apt-mirrors.txt; then
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi

          # Reject partial updates instead of silently using stale package indexes.
          apt_updated=false
          for attempt in 1 2 3 4; do
            echo "APT index update attempt ${attempt}/4"
            if sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update 2>&1 | tee /tmp/apt-update.log; then
              if ! grep -Eq 'W: Failed to fetch|Some index files failed to download' /tmp/apt-update.log; then
                apt_updated=true
                break
              fi
            fi
            if [ "${attempt}" -lt 4 ]; then
              echo "APT update incomplete; retrying in 15 seconds."
              sleep 15
            fi
          done

          if [ "${apt_updated}" != true ]; then
            echo "::error::APT indexes could not be updated from Ubuntu mirrors."
            echo "DNS diagnostics:"
            getent ahosts archive.ubuntu.com || true
            getent ahosts azure.archive.ubuntu.com || true
            exit 1
          fi

          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=60 \
            -o Acquire::https::Timeout=60 \
            install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl jq ccache
      - name: Clone IPQ platform source
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://github.com/ones20250/immortalwrt_ipq.git openwrt
          cd openwrt
          git log -1 --format='%H %s' > "$GITHUB_WORKSPACE/base-commit.txt"
      - name: Integrate PassWall2 and configure
        run: |
          set -Eeuo pipefail
          LOG="$GITHUB_WORKSPACE/ax6600-build.log"
          : > "$LOG"
          trap 'status=$?; tail -n 160 "$LOG"; exit "$status"' ERR
          exec >> "$LOG" 2>&1
          cp config/ax6600.config openwrt/.config
          bash scripts/add-passwall2.sh "$GITHUB_WORKSPACE/openwrt"
          grep -q 'IPKG_INSTROOT' "$GITHUB_WORKSPACE/openwrt/package/alexwrt/passwall2/luci-app-passwall2/root/usr/share/passwall2/utils.sh"
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Add ImmortalWrt package/LuCI ecosystems without replacing OpenWrt packages.
          bash "$GITHUB_WORKSPACE/scripts/integrate-immortalwrt-feeds.sh" "$GITHUB_WORKSPACE/openwrt"
          bash "$GITHUB_WORKSPACE/scripts/patch-ax6600-compat.sh" "$GITHUB_WORKSPACE/openwrt"
          make defconfig
          grep -qx 'CONFIG_KERNEL_DYNAMIC_DEBUG=y' .config
          for symbol in CONFIG_ATH11K_DEBUG CONFIG_IKCONFIG CONFIG_IKCONFIG_PROC; do
            grep -qx "${symbol}=y" target/linux/qualcommax/config-6.18 || {
              echo "::error::Required AX6600 kernel config missing: ${symbol}=y"
              exit 1
            }
          done
          make -j"$(nproc)" download
      - name: Compile
        run: |
          set -Eeuo pipefail
          LOG="$GITHUB_WORKSPACE/ax6600-build.log"
          trap 'status=$?; tail -n 200 "$LOG"; exit "$status"' ERR
          cd openwrt
          make -j"$(nproc)" V=s >> "$LOG" 2>&1
      - name: Summarize build diagnostics
        if: always()
        run: |
          set -Eeuo pipefail
          LOG="$GITHUB_WORKSPACE/ax6600-build.log"
          if [ -f "$LOG" ]; then
            grep -nEi '(^|[[:space:]])(WARNING:|warning:|ERROR:|error:|fatal:)|No such file or directory|undefined reference|make\[[0-9]+\]: \*\*\*' "$LOG" | tail -n 200 || true
            echo "Total diagnostic matches: $(grep -Eic 'WARNING:|warning:|ERROR:|error:|fatal:|No such file or directory|undefined reference' "$LOG" || true)"
          else
            echo "Build log was not created."
          fi
      - name: Preserve diagnostics even when build fails
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostics
          LOG="$GITHUB_WORKSPACE/ax6600-build.log"
          if [ -f "$LOG" ]; then
            cp "$LOG" diagnostics/ax6600-build.log
            grep -nEi '(^|[[:space:]])(WARNING:|warning:|ERROR:|error:|fatal:)|No such file or directory|undefined reference|make\\[[0-9]+\\]: \\*\\*\\*' "$LOG" > diagnostics/build-diagnostics.txt || true
            {
              echo "Log bytes: $(wc -c < "$LOG")"
              echo "Warning count: $(grep -Eic 'WARNING:|warning:' "$LOG" || true)"
              echo "Error/fatal count: $(grep -Eic 'ERROR:|error:|fatal:|undefined reference|No such file or directory' "$LOG" || true)"
              echo "Last 160 diagnostic lines:"
              tail -n 160 diagnostics/build-diagnostics.txt || true
            } > diagnostics/summary.txt
          else
            printf 'AX6600 build log was not created.\n' > diagnostics/summary.txt
          fi
      - name: Upload diagnostics (including failed builds)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AlexWrt-AX6600-diagnostics-${{ github.run_number }}
          path: diagnostics/*
          if-no-files-found: warn
          retention-days: 30
      - name: Collect and validate
        run: |
          set -Eeuo pipefail
          mkdir -p out
          find openwrt/bin/targets -type f \( -name '*jdcloud*factory*.bin' -o -name '*jdcloud*sysupgrade*.bin' -o -name '*jdcloud*factory*.img' -o -name '*jdcloud*sysupgrade*.img' \) -exec cp -v {} out/ \;
          test -n "$(find out -type f)"
          KERNEL_CONFIG="$(find openwrt/build_dir -type f -path '*/linux-*/.config' -print -quit)"
          if [ -z "$KERNEL_CONFIG" ]; then
            echo "::error::Generated Linux kernel .config was not found."
            exit 1
          fi
          for symbol in CONFIG_DEBUG_FS CONFIG_DYNAMIC_DEBUG CONFIG_ATH11K_DEBUG CONFIG_IKCONFIG CONFIG_IKCONFIG_PROC; do
            if ! grep -qx "${symbol}=y" "$KERNEL_CONFIG"; then
              echo "::error::Final kernel config is missing ${symbol}=y"
              grep -E "^(# ${symbol} is not set|${symbol}=)" "$KERNEL_CONFIG" || true
              exit 1
            fi
          done
          cp "$KERNEL_CONFIG" out/kernel.config.txt
          cp openwrt/.config out/config.txt
          cp base-commit.txt upstream-commits.txt out/
          cp "$GITHUB_WORKSPACE/ax6600-build.log" out/ 2>/dev/null || true
          if [ -f "$GITHUB_WORKSPACE/ax6600-build.log" ]; then
            grep -nEi '(^|[[:space:]])(WARNING:|warning:|ERROR:|error:|fatal:)|No such file or directory|undefined reference' "$GITHUB_WORKSPACE/ax6600-build.log" > out/build-diagnostics.txt || true
          else
            printf 'Build log unavailable.\\n' > out/build-diagnostics.txt
          fi
          (cd out && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: AlexWrt-AX6600-${{ github.run_number }}
          path: out/*
          retention-days: 30
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ax6600-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "AlexWrt AX6600 $TAG" --notes 'JDCloud RE-CS-02 build. Verify SHA256SUMS and image type before flashing.'
name: AX6600 JDCloud RE-CS-02
on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * *'
  push:
    paths: ['.github/workflows/ax6600.yml', 'config/ax6600.config', 'scripts/**']
permissions:
  contents: write
concurrency:
  group: ax6600-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq ccache
      - name: Clone IPQ platform source
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://github.com/ones20250/immortalwrt_ipq.git openwrt
          cd openwrt
          git log -1 --format='%H %s' > "$GITHUB_WORKSPACE/base-commit.txt"
      - name: Integrate PassWall2 and configure
        run: |
          set -Eeuo pipefail
          LOG="$GITHUB_WORKSPACE/ax6600-build.log"
          : > "$LOG"
          trap 'status=$?; tail -n 160 "$LOG"; exit "$status"' ERR
          exec >> "$LOG" 2>&1
          cp config/ax6600.config openwrt/.config
          bash scripts/add-passwall2.sh "$GITHUB_WORKSPACE/openwrt"
          grep -q 'IPKG_INSTROOT' "$GITHUB_WORKSPACE/openwrt/package/alexwrt/passwall2/luci-app-passwall2/root/usr/share/passwall2/utils.sh"
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash "$GITHUB_WORKSPACE/scripts/patch-ax6600-compat.sh" "$GITHUB_WORKSPACE/openwrt"
          make defconfig
          make -j"$(nproc)" download
      - name: Compile
        run: |
          set -Eeuo pipefail
          LOG="$GITHUB_WORKSPACE/ax6600-build.log"
          trap 'status=$?; tail -n 200 "$LOG"; exit "$status"' ERR
          cd openwrt
          make -j"$(nproc)" V=s >> "$LOG" 2>&1
      - name: Summarize build diagnostics
        if: always()
        run: |
          set -Eeuo pipefail
          LOG="$GITHUB_WORKSPACE/ax6600-build.log"
          if [ -f "$LOG" ]; then
            grep -nEi '(^|[[:space:]])(WARNING:|warning:|ERROR:|error:|fatal:)|No such file or directory|undefined reference|make\[[0-9]+\]: \*\*\*' "$LOG" | tail -n 200 || true
            echo "Total diagnostic matches: $(grep -Eic 'WARNING:|warning:|ERROR:|error:|fatal:|No such file or directory|undefined reference' "$LOG" || true)"
          else
            echo "Build log was not created."
          fi
      - name: Preserve diagnostics even when build fails
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostics
          LOG="$GITHUB_WORKSPACE/ax6600-build.log"
          if [ -f "$LOG" ]; then
            cp "$LOG" diagnostics/ax6600-build.log
            grep -nEi '(^|[[:space:]])(WARNING:|warning:|ERROR:|error:|fatal:)|No such file or directory|undefined reference|make\\[[0-9]+\\]: \\*\\*\\*' "$LOG" > diagnostics/build-diagnostics.txt || true
            {
              echo "Log bytes: $(wc -c < "$LOG")"
              echo "Warning count: $(grep -Eic 'WARNING:|warning:' "$LOG" || true)"
              echo "Error/fatal count: $(grep -Eic 'ERROR:|error:|fatal:|undefined reference|No such file or directory' "$LOG" || true)"
              echo "Last 160 diagnostic lines:"
              tail -n 160 diagnostics/build-diagnostics.txt || true
            } > diagnostics/summary.txt
          else
            printf 'AX6600 build log was not created.\n' > diagnostics/summary.txt
          fi
      - name: Upload diagnostics (including failed builds)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AlexWrt-AX6600-diagnostics-${{ github.run_number }}
          path: diagnostics/*
          if-no-files-found: warn
          retention-days: 30
      - name: Collect and validate
        run: |
          set -Eeuo pipefail
          mkdir -p out
          find openwrt/bin/targets -type f \( -name '*jdcloud*factory*.bin' -o -name '*jdcloud*sysupgrade*.bin' -o -name '*jdcloud*factory*.img' -o -name '*jdcloud*sysupgrade*.img' \) -exec cp -v {} out/ \;
          test -n "$(find out -type f)"
          cp openwrt/.config out/config.txt
          cp base-commit.txt upstream-commits.txt out/
          cp "$GITHUB_WORKSPACE/ax6600-build.log" out/ 2>/dev/null || true
          if [ -f "$GITHUB_WORKSPACE/ax6600-build.log" ]; then
            grep -nEi '(^|[[:space:]])(WARNING:|warning:|ERROR:|error:|fatal:)|No such file or directory|undefined reference' "$GITHUB_WORKSPACE/ax6600-build.log" > out/build-diagnostics.txt || true
          else
            printf 'Build log unavailable.\\n' > out/build-diagnostics.txt
          fi
          (cd out && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: AlexWrt-AX6600-${{ github.run_number }}
          path: out/*
          retention-days: 30
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ax6600-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "AlexWrt AX6600 $TAG" --notes 'JDCloud RE-CS-02 build. Verify SHA256SUMS and image type before flashing.'